name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, NDK, CMake)
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Run JVM unit tests (model, exporters, shaping)
        run: ./gradlew --no-daemon :core-model:test :core-export:testDebugUnitTest :core-shaping:testDebugUnitTest

      - name: Assemble debug APK (includes native HarfBuzz build)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
